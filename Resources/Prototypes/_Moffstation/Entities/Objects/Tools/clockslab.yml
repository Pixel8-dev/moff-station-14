# Hell, I've got no clue what I'm doing here
- type: entity
  name: clockwork slab
  parent: BaseItem
  id: ClockworkSlab
  description: An advanced tool to copy, store, and send electrical pulses and signals through wires and machines.
  components:
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    layers:
    - state: icon
  - type: Item
    size: Small
  - type: Spellbook
    spellActions:
      ActionClockworkKindle: null
  - type: GuideHelp
    guides:
    - Networking
    - WirePanels
    - Airlocks
    - InspectingPower

- type: entity
  parent: BaseItem
  id: DebugRemoteSignaller
  name: debug remote
  description: A handheld device used for remotely sending signals to objects within a small radius of about 15 meters.
  components:
  - type: Sprite
    sprite: Objects/Devices/signaller.rsi
    state: signaller
  - type: TriggerOnActivate
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: ClockworkTeleport
  - type: StaticPrice
    price: 40
